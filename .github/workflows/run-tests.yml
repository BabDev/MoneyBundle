name: 'Run Tests'

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.can-fail }}
    strategy:
      fail-fast: true
      matrix:
        php: ['8.4', '8.5']
        symfony: ['7.4.*', '8.0.*']
        composer-flags: ['--prefer-stable']
        can-fail: [false]
        has-jms: [true]
        has-mongodb: [true]
        extensions: ['curl, iconv, mbstring, mongodb, pdo, pdo_sqlite, sqlite, zip']
        include:
          - php: '8.4'
            symfony: '7.4.*'
            composer-flags: '--prefer-stable --prefer-lowest'
            extensions: 'curl, iconv, mbstring, mongodb, pdo, pdo_sqlite, sqlite, zip'
            can-fail: false
            has-jms: true
            has-mongodb: true
          - php: '8.4'
            symfony: '7.4.*'
            composer-flags: '--prefer-stable'
            extensions: 'curl, iconv, mbstring, pdo, pdo_sqlite, sqlite, zip'
            can-fail: false
            has-jms: true
            has-mongodb: false

    name: "PHP ${{ matrix.php }}${{ matrix.has-mongodb == false && ' - Without MongoDB' || '' }} - Symfony ${{ matrix.symfony }}${{ matrix.composer-flags != '' && format(' - Composer {0}', matrix.composer-flags) || '' }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2,flex
          extensions: ${{ matrix.extensions }}
          coverage: none

      - name: Remove JMS Serializer
        if: matrix.has-jms == false
        run: composer remove --dev --no-update jms/serializer jms/serializer-bundle

      - name: Remove MongoDB
        if: matrix.has-mongodb == false
        run: |
          composer remove --dev --no-update doctrine/mongodb-odm doctrine/mongodb-odm-bundle

      - name: Install dependencies
        run: |
          composer update ${{ matrix.composer-flags }} --prefer-dist --no-suggest
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}

      - name: Execute tests
        run: vendor/bin/phpunit
